<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

  }

  }

    position: fixed;

    justify-content: space-between;

  }

  .hdr-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(226,223,217,0.45);
  }
  .hdr-title span { color: rgba(226,223,217,0.9); }

  .hdr-stats {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: rgba(107,107,126,0.8);
  }
  .hdr-stats strong { color: rgba(226,223,217,0.85); }
  .hdr-dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(107,107,126,0.4); }

  /* ── LABELS ──────────────────────────────────────── */
  #labels {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 30;
  }

  .plabel {
    position: absolute;
    transform: translate(-50%, 28px);
    text-align: center;
    pointer-events: all;
    cursor: pointer;
  }

  .plabel-name {
    font-size: 9.5px;

    text-transform: uppercase;
    white-space: nowrap;
    transition: opacity 150ms;

// ── CANVAS ───────────────────────────────────────────────────────

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildLabels();
}
window.addEventListener('resize', resize);

// ── STARS ────────────────────────────────────────────────────────

const STARS = Array.from({ length: 220 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.3 + 0.2,
  a: Math.random() * 0.55 + 0.15,
  tw: Math.random() * Math.PI * 2,
  sp: Math.random() * 0.6 + 0.4,
}));

// ── ORBIT SETUP ──────────────────────────────────────────────────

function buildOrbits() {
  PHASES.forEach(p => {
    p.particles = p.commits.map((_, i) => ({
      angle: (i / p.commits.length) * Math.PI * 2,
      speed: 0.0028 + Math.random() * 0.0018,
      r: 46 + (i % 3) * 5,
      size: 2.8 + Math.random() * 1.4,
    }));
  });
}

// ── BEZIER CONTROL POINTS ────────────────────────────────────────

function ctrl(a, b, idx) {
  const ax = a.px * W, ay = a.py * H;
  const bx = b.px * W, by = b.py * H;
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const dx = bx - ax, dy = by - ay;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const bend = len * 0.20 * (idx % 2 === 0 ? 1 : -1);
  return { cpx: mx + (-dy / len) * bend, cpy: my + (dx / len) * bend };
}

// ── TRAVELER ─────────────────────────────────────────────────────

let travT = 0;

function travPoint(tv) {
  const total = PHASES.length - 1;
  const seg = Math.min(Math.floor(tv * total), total - 1);
  const st = tv * total - seg;
  const a = PHASES[seg], b = PHASES[seg + 1];
  const { cpx, cpy } = ctrl(a, b, seg);
  const ax = a.px * W, ay = a.py * H;
  const bx = b.px * W, by = b.py * H;
  return {
    x: (1-st)*(1-st)*ax + 2*(1-st)*st*cpx + st*st*bx,
    y: (1-st)*(1-st)*ay + 2*(1-st)*st*cpy + st*st*by,
  };
}

// ── LABELS ───────────────────────────────────────────────────────

function buildLabels() {
  const layer = document.getElementById('labels');
  layer.innerHTML = '';
  PHASES.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'plabel';
    el.style.cssText = `left:${p.px*100}%;top:${p.py*100}%`;
    el.innerHTML = `
      <div class="plabel-name" style="color:${p.color}">${p.short}</div>
      <div class="plabel-sub">${p.commits.length} commits</div>`;
    el.addEventListener('mouseenter', () => showDetail(i, el));
    el.addEventListener('mouseleave', hideDetail);
    layer.appendChild(el);
    p._el = el;
  });
}

// ── DETAIL PANEL ─────────────────────────────────────────────────

const detPanel = document.getElementById('detail');
const detIcon  = document.getElementById('det-icon');
const detTitle = document.getElementById('det-title');
const detDate  = document.getElementById('det-date');
const detCommits = document.getElementById('det-commits');
let hideTimer = null;

function showDetail(idx, anchor) {
  clearTimeout(hideTimer);
  const p = PHASES[idx];
  PHASES.forEach(q => q._hovered = false);
  p._hovered = true;

  detIcon.textContent = p.icon;
  detTitle.textContent = p.name;
  detTitle.style.color = p.color;
  detDate.textContent = p.date;
  detCommits.innerHTML = p.commits.map(c =>
    `<div class="det-commit"><span class="det-hash">${c.h}</span>${c.msg}</div>`
  ).join('');

  // Position panel
  const nx = p.px * W, ny = p.py * H;
  const pw = 296, ph = Math.min(p.commits.length * 38 + 70, 440);
  const margin = 20;
  let left = nx + 58;
  let top  = ny - 30;
  if (left + pw > W - margin) left = nx - pw - 30;
  if (left < margin) left = margin;
  if (top + ph > H - margin) top = H - ph - margin;
  if (top < 60) top = 60;

  detPanel.style.left = `${left}px`;
  detPanel.style.top  = `${top}px`;
  detPanel.classList.add('show');
}

function hideDetail() {
  hideTimer = setTimeout(() => {
    detPanel.classList.remove('show');
    PHASES.forEach(p => p._hovered = false);
  }, 140);
}

detPanel.addEventListener('mouseenter', () => clearTimeout(hideTimer));
detPanel.addEventListener('mouseleave', hideDetail);

// ── DRAW LOOP ─────────────────────────────────────────────────────

let tick = 0;

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#080810';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.save();
  STARS.forEach(s => {
    const tw = Math.sin(tick * 0.007 * s.sp + s.tw) * 0.28 + 0.72;
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  // Phase nebula glow
  PHASES.forEach(p => {
    const x = p.px * W, y = p.py * H;
    const hov = p._hovered;
    const r = hov ? 100 : 72;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, p.color + (hov ? '4a' : '28'));
    g.addColorStop(0.5, p.color + (hov ? '18' : '0c'));
    g.addColorStop(1, p.color + '00');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Connections
  ctx.save();
  ctx.setLineDash([5, 10]);
  ctx.lineDashOffset = -tick * 0.38;
  for (let i = 0; i < PHASES.length - 1; i++) {
    const a = PHASES[i], b = PHASES[i + 1];
    const { cpx, cpy } = ctrl(a, b, i);
    const ax = a.px * W, ay = a.py * H;
    const bx = b.px * W, by = b.py * H;
    const gr = ctx.createLinearGradient(ax, ay, bx, by);
    gr.addColorStop(0, a.color + '80');
    gr.addColorStop(1, b.color + '80');
    ctx.strokeStyle = gr;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(cpx, cpy, bx, by);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();

  // Orbit rings
  PHASES.forEach(p => {
    const x = p.px * W, y = p.py * H;
    ctx.save();
    ctx.strokeStyle = p.color + '1e';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 5]);
    ctx.beginPath();
    ctx.arc(x, y, 50, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  });

  // Phase circles
  PHASES.forEach((p, idx) => {
    const x = p.px * W, y = p.py * H;
    const hov = p._hovered;
    const r = hov ? 25 : 21;

    // Outer glow ring when hovered
    if (hov) {
      ctx.save();
      ctx.strokeStyle = p.color + '55';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(x, y, r + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Circle fill
    ctx.fillStyle = p.color + '22';
    ctx.strokeStyle = p.color + (hov ? 'ff' : 'cc');
    ctx.lineWidth = hov ? 2.5 : 1.8;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Phase number ring inner
    ctx.fillStyle = p.color + '35';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.48, 0, Math.PI * 2);
    ctx.fill();

    // Phase number
    ctx.fillStyle = p.color + 'cc';
    ctx.font = `bold 9px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(idx + 1).padStart(2, '0'), x, y);
  });

  // Orbit particles (commits)
  PHASES.forEach(p => {
    const x = p.px * W, y = p.py * H;
    const hov = p._hovered;
    p.particles.forEach(pt => {
      pt.angle += pt.speed * (hov ? 3 : 1);
      const px = x + Math.cos(pt.angle) * pt.r;
      const py = y + Math.sin(pt.angle) * pt.r;

      // Glow
      const g = ctx.createRadialGradient(px, py, 0, px, py, pt.size * 2.5);
      g.addColorStop(0, p.color + 'dd');
      g.addColorStop(1, p.color + '00');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, pt.size * 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Core dot
      ctx.fillStyle = hov ? '#fff' : p.color + 'ee';
      ctx.beginPath();
      ctx.arc(px, py, hov ? pt.size * 0.9 : pt.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
    });
  });

  // Traveling dot
  travT = (travT + 0.00045) % 1;
  const tp = travPoint(travT);

  // Traveler trail
  for (let t2 = 0; t2 < 6; t2++) {
    const trailT = ((travT - t2 * 0.003) + 1) % 1;
    const trailP = travPoint(trailT);
    ctx.globalAlpha = (6 - t2) / 6 * 0.35;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(trailP.x, trailP.y, 3 - t2 * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Traveler glow
  const tg = ctx.createRadialGradient(tp.x, tp.y, 0, tp.x, tp.y, 16);
  tg.addColorStop(0, 'rgba(255,255,255,0.7)');
  tg.addColorStop(0.4, 'rgba(255,255,255,0.2)');
  tg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.arc(tp.x, tp.y, 16, 0, Math.PI * 2);
  ctx.fill();

  // Traveler core
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(tp.x, tp.y, 3.5, 0, Math.PI * 2);
  ctx.fill();

  tick++;
  requestAnimationFrame(draw);
}

// ── INIT ─────────────────────────────────────────────────────────

buildOrbits();
resize();
draw();
</script>
</body>
</html>
